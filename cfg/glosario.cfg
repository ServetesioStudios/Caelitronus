[Caelius]

nombre="Caelius"
descripcionira="	Bendecido fue al nacer. Eso decían. Caelius lo creyó, y ese fue su primer pecado. Nunca se vio como un hombre entre hombres. Se vio por encima. Más puro. Más elegido. Más cercano a Dios. La fe no lo volvió humilde: lo volvió soberbio. Cuando lo hicieron cura, no lo tomó como servicio, sino como permiso. Poder le dieron, y lo usó sin medida. Junto al Padre Espina tomó a los esclavos. Los poseyó. Los quebró. Cuerpos sometidos bajo promesas de salvación, silencio comprado con miedo y culpa. Rezaban antes de abusar. Bendecían antes de destruir. Caelius no se escondía: se sentía justo. Creía que Dios miraba y aprobaba. Durante años fueron intocables. Hasta que una lista apareció. Nombres. Fechas. Actos. Detalles imposibles de negar. El de Espina estaba allí. El de Caelius también. Y cuando la Iglesia comenzó a arder, Espina no dudó un segundo. Traicionó. Señaló a Caelius. Lo entregó como carne de sacrificio para salvarse. El obispo Sérpico selló el encubrimiento. Espina fue absuelto. Protegido. Limpio ante los ojos del clero. Caelius fue abandonado. Fue juzgado por los crímenes cometidos junto a Espina. No hubo piedad. No hubo defensa. El castigo fue peor que la muerte: una maldición. Le rompieron la voz. Su sintaxis fue invertida. Su lengua ya no obedece. Desde entonces, no comunica: se retuerce. Es una burla viviente. La ira lo consumió. Escupió la fe. Renunció al sacerdocio. Renunció a Dios. Si el cielo lo había castigado, entonces lo conquistaría. Cuando escuchó de la muerte del Papa, entendió el mensaje. No era una casualidad. Era una oportunidad. Si tomaba el trono papal, sería más poderoso que la maldición. Más poderoso que la Iglesia. Más poderoso que Dios. Con ese poder rompería el castigo, reescribiría su voz, y silenciaría para siempre la culpa que le roe los huesos. No busca redención. No busca perdón. Busca el trono para coronarse a sí mismo. Para ser escuchado. Para ser temido. Para ser el dios del nuevo mundo."
descripcionpena="	Bendecido fue al nacer. Eso decían. Caelius lo creyó, y ese fue su primer pecado. Nunca se vio como un hombre entre hombres. Se vio incompleto. Fallado. Indigno. La fe no lo volvió humilde: lo volvió dependiente. Necesitaba sentirse elegido para no sentirse nada. Cuando lo hicieron cura, no lo tomó como servicio, sino como refugio. Poder le dieron, y lo usó para dejar de sentirse pequeño. Junto al Padre Espina tomó a los esclavos. Los poseyó. Los quebró. No por grandeza, sino por miseria. Cuerpos sometidos para probarse existencia, dolor ajeno para tapar el propio vacío. Promesas de salvación usadas como cadenas, silencio comprado con miedo y culpa. Rezaban antes de abusar. Bendecían antes de destruir. Caelius no se ocultaba: se convencía. Se repetía que era voluntad divina. Que si dolía, debía doler. Que si obedecían, era porque así estaba escrito. Durante años fueron intocables. No porque fueran fuertes, sino porque nadie quería mirar. Hasta que una lista apareció. Nombres. Fechas. Actos. Detalles imposibles de negar. El de Espina estaba allí. El de Caelius también. Y cuando la Iglesia comenzó a arder, Espina no dudó. Traicionó. Señaló a Caelius. Lo entregó como carne de sacrificio para salvarse. El obispo Sérpico selló el encubrimiento. Espina fue absuelto. Protegido. Limpio ante los ojos del clero. Caelius fue abandonado. Fue juzgado por los crímenes cometidos junto a Espina. No hubo piedad. No hubo defensa. El castigo fue peor que la muerte: una maldición. Le rompieron la voz. Su sintaxis fue invertida. Es una burla viviente. Se lleno de Una culpa espesa, constante, imposible de callar. Cada palabra torcida se la recuerda. Cada silencio pesa. Renunció al sacerdocio porque la fe ya no lo consolaba. Renunció a Dios porque la culpa no lo dejaba rezar. Cuando escuchó de la muerte del Papa, entendió el sentido. No fue señal divina. Fue oportunidad humana. Si tomaba el trono papal, podría callar la culpa. Podría imponer su voz sobre el eco. Ser más que el recuerdo, más que el pecado, más que los hombres que lo juzgan. Con ese poder rompería la maldición, reescribiría su voz, y por primera vez no se sentiría menos. No busca redención. No busca perdón. Busca el trono para dejar de odiarse. Para ser escuchado sin deformarse. Para existir sin vergüenza. Para, al fin, ser más que los demás."
descripcionego="	Bendecido fue al nacer. Eso decían. Caelius lo creyó, y ese fue su primer acierto. Nunca se vio como un hombre entre hombres. Se vio por encima. Más puro. Más elegido. Más cercano a Dios. La fe no lo volvió humilde: lo confirmó. Cuando lo hicieron cura, no lo tomó como servicio, sino como derecho. Poder le dieron, y lo usó sin medida. Junto al Padre Espina tomó a los esclavos. Los poseyó. Los quebró. Cuerpos sometidos bajo promesas de salvación, silencio comprado con miedo y culpa. Rezaban antes de abusar. Bendecían antes de destruir. Caelius no se escondía: se sentía correcto. No creía estar pecando. Creía estar ejerciendo. Dios veía. Dios callaba. Eso era aprobación. Durante años fueron intocables. Hasta que una lista apareció. Nombres. Fechas. Actos. Detalles imposibles de negar. El de Espina estaba allí. El de Caelius también. Y cuando la Iglesia comenzó a arder, Espina no dudó. Traicionó. Señaló a Caelius. Lo entregó como carne de sacrificio para salvarse. El obispo Sérpico selló el encubrimiento. Espina fue absuelto. Protegido. Limpio ante los ojos del clero. Caelius fue abandonado. Fue juzgado por los crímenes cometidos junto a Espina. No hubo piedad. No hubo defensa. Y aun así, Caelius no se sintió culpable. No se sintió sucio. No se sintió menos. Escuchó la sentencia como quien oye un error administrativo. El castigo fue peor que la muerte: una maldición. Le rompieron la voz. Su lengua ya no obedece. Desde entonces, no comunica: se retuerce. Es una burla viviente. Renunció al cargo, no a la fe. Se apartó del sacerdocio, no de Dios. Siguió creyendo. Rezando. Esperando. No por perdón, sino por destino. Sabía que no había terminado. Sabía que lo que era no podía quedar así. Cuando escuchó de la muerte del Papa, entendió que el tiempo había llegado. No fue señal divina. Fue confirmación. Si tomaba el trono papal, sería más poderoso que la maldición. Más poderoso que la Iglesia. Más poderoso que el cielo que lo castigó. Con ese poder rompería el castigo, recuperaría su voz y ocuparía el lugarque siempre le perteneció. No busca redención. No busca perdón. Busca el trono porque nació para él. Porque el mundo necesita un dios visible. Porque los hombres siempre fueron sus inferiores. Y cuando se corone, no habrá fieles. Habrá juguetes."
religion="	Caelius pertenece al Catolicismo. los católicos se muestran profundamente dependientes de sus emociones; cada alegría, cada miedo o cada remordimiento parece moldear su ser. Sus almas, frágiles y cambiantes, se balancean entre la esperanza y la culpa, incapaces de encontrar un equilibrio duradero."
almaira="1"
almapena="2"
almaego="3"

[Papa]

nombre="El Papa"
descripcion="	El Papa no llegó al trono por gracia divina, sino por hambre. Devoró a su predecesor y a cada uno que deseó la corona antes que él, consumiendo su poder, su fe y su ambición. No heredó el trono: lo digirió. Así se volvió Papa, reuniendo en su carne las voluntades rotas de quienes quiso serlo antes. Desde entonces el mundo fue arcilla en sus manos. Moldeó cuerpos y almas sin resistencia, pero su gobierno carecía de furia. Fue un poder estéril, metódico, predecible. Mandó sin pasión, castigó sin espectáculo, profanó sin arte. La fe se volvió rutina. El pecado, costumbre. Eso enfureció a la Monja Roja. Ella no soportó la monotonía del horror. Un Papa sin exceso era una blasfemia mayor que cualquier sacrilegio. Su liturgia era gris, su crueldad aburrida, su dominio carente de delirio. Donde debía haber fuego, había tedio. Donde debía haber sangre, había cálculo. La muerte del Papa no fue castigo divino ni rebelión humana. Fue consecuencia. Fue hastío encarnado. La Monja Roja actuó, no por justicia, sino por desprecio. Un dios que aburre no merece existir. Y así cayó. No derrotado, sino descartado. El trono que conquistó devorando a otros se volvió su sepultura. Los poderes que robó lo abandonaron. Las fes que consumió se pudrieron dentro de él. Ahora su nombre no inspira temor ni reverencia, solo una lección silenciosa: incluso el pecado exige devoción. Y la Monja Roja no perdona la mediocridad."
religion="	El Papa, pertenece a los Aghori. Estos seres repugnantes veneran la carne ajena y se alimentan de otros para aumentar su poder. Cuanto más consumen, más crece su fuerza, convirtiéndose en criaturas cuya maldad y apetito no conocen límites."
alma=""

[Monja]

nombre="La Monja Roja"
descripcion="	La Monja Roja no nació. Siempre estuvo. No tiene género ni forma verdadera. Existe para divertirse. El mundo es su escenario y el poder, su entretenimiento favorito. Detesta los cónclaves y las votaciones. Le aburren. Por eso los transforma en peleas sangrientas. Cada Papa, tarde o temprano, se vuelve predecible. La fe se vuelve rutina, el horror se vuelve costumbre. Cuando eso ocurre, la Monja Roja actúa. Mata al Papa. No por justicia ni castigo divino, sino por hastío. Luego inicia un nuevo conclave por el poder, caótico y violento, donde los aspirantes se destruyen entre sí para ocupar el trono. El drama es su alimento. La traición, su música. La caída de los poderosos, su mayor placer. No adopta una forma única. Se muestra como cada persona desea verla o teme verla. Para algunos es una monja cubierta de rojo; para otros, un reflejo deformado de sus deseos. Nadie la ve igual, porque nadie la merece igual. Para ella, los humanos son juguetes, piezas en un juego que nunca termina. Hubo una excepción. Fray Corvus. Su locura la divierte, pero también la comprende. En él sintió algo parecido a la amistad. No lo protege ni lo salva. Solo lo observa, con un interés que no concede a nadie más. Mientras exista ambición, la Monja Roja seguirá jugando."
religion="	La Monja no pertenece a ninguna religión. Es un ser inmortal, creada con un propósito único: observar, narrar y dirigir. Su existencia trasciende las creencias humanas; está allí para divertirse, y para mantener el orden en un mundo que los mortales apenas comprenden."
alma=""

[Monaquillo]

nombre="Monaquillos"
descripcion="	Los monaquillos no siempre fueron así. Algunos nacieron malditos; otros fueron personas comunes, marcadas por la maldición de una religión prohibida: Devotio Aeterna. Quien es tocado por su rito pierde la elección, el destino y el nombre. La fe no los salva: los deforma. La transformación es lenta e irreversible. La carne obedece, la mente se vacía, la identidad se quiebra. Así nacen los monaquillos. No son hombres ni mujeres, ni siquiera almas completas. Son restos. Juguetes quebrados en manos de verdugos santos. No tienen voz propia. Aunque el cuerpo envejezca, ante sus dominadores siguen siendo niños. Niños eternos, detenidos en un estado de obediencia absoluta, sin pasado ni futuro. Son un rebaño de cuerpos repetidos, un eco de dolor que no termina. Carne ofrecida a deseos oscuros, sacrificio vivo para saciar una fe enferma. Abren el pecho para ser desgarrados, entregan el aliento para ser sofocado, ceden la piel para ser marcada y rota. Cada herida es doctrina. Cada grito, oración. Nadie escapa. Ninguno conoce la libertad. Son piezas de un juego cruel, gritos ahogados entre muros sagrados: un coro de lamento que ni la muerte se atreve a silenciar."
religion="	Los monaquillos pertenecen a la Devotio Aeterna. Desde el momento de su nacimiento, están condenados a este destino: una vida marcada por la devoción estricta y la obediencia absoluta. No conocen otra existencia; su camino está trazado desde antes de que puedan comprenderlo, y su voluntad se encuentra siempre subordinada a la orden que los reclama."
alma=""

[Espina]

nombre="Padre Espina"
descripcion="	Padre Espina nació en un pueblo donde la religión lo era todo. Allí no se soñaba con vivir: se soñaba con mandar. Todos aspiraban al trono papal, y Espina aprendió desde niño que la fe era una escalera hecha de cuerpos. Cuando obtuvo el cargo de padre, sintió por primera vez el poder verdadero. No tardó en descubrir su placer: no necesitaba sexo ni devoción, solo dolor. El sufrimiento ajeno lo excitaba de una forma que nunca antes había sentido. Lo ocultó bien. Fingió bondad, disciplina, piedad. Ante los fieles era un hombre recto; en privado, un verdugo paciente. El monstruo solo mostraba el rostro cuando nadie podía denunciarlo. Todo empeoró cuando conoció a Caelius. Tener a alguien que compartiera su crueldad lo liberó. Ya no estaba solo. Ya no tenía freno. Entonces apareció la lista. Nombres, actos, pruebas. El obispo Sérpico le ofreció protección, pero exigió un sacrificio. Alguien debía caer. Espina no dudó. Traicionó a Caelius sin remordimiento y siguió adelante, limpio ante la Iglesia, intacto ante el poder. Desde entonces se volvió más agresivo. Más descuidado. Dañaba a sus víctimas hasta romperlas y, cuando ya no quedaba nada, los maldecía. Así las convertía en monaquillos: cuerpos malditos, obedientes, eternamente sometidos. Para Espina, era el cierre perfecto del rito. Cuando supo de la muerte del Papa, entendió que el mundo volvía a abrirse. Si tomaba el trono, podría dañar a quien quisiera sin consecuencias. No habría juicio. No habría límites. Todos se arrodillarían. Y el dolor, por fin, sería ley."
religion="	El Padre Espina pertenece al hinduismo. En esta religión, la moral es lo más importante: cuanto más se apega una persona a sus principios, mayor es el poder que obtiene. Sin embargo, la moral es un concepto abstracto y ambiguo, que depende en gran medida de cada individuo; lo que para uno es correcto, para otro puede ser cuestionable, y, aun así, su fuerza se mide por la rectitud de su propia interpretación."
alma=""

[Serpico]

nombre="Obispo Serpico"
descripcion="	El obispo Sérpico nació en la riqueza. Desde niño aprendió que el verdadero poder no está en la fe, sino en el dinero y los secretos. No llegó al obispado por vocación: heredó el título de su padre, junto con una red de influencias que supo expandir sin escrúpulos. Con el cargo descubrió confesiones, crímenes y abusos. No los denunció: los guardó. Cada secreto tenía un precio, y cada encubrimiento compraba poder. Cuando acumuló suficientes pruebas, liberó una lista. No para hacer justicia, sino para dominar. Todos quedaron expuestos. Todos quedaron atados a él. Luego volvió a encubrirlos. Pero no a todos. Algunos debían caer. Los menos ricos. Los menos influyentes. Los que ya no eran útiles. Sus sacrificios sostuvieron el sistema. El día de la muerte del Papa fue el mejor de su vida. Con tantos hilos en la mano, el trono ya no parecía un sueño, sino una inversión. No dudó en entrar en la batalla por el poder. Si ganaba, no gobernaría por fe ni por terror. Gobernaría por control."
religion="	El Obispo Serpico pertenece al Zoroastrismo. En esta religión, la fuerza de un individuo crece al alcanzar la edad adulta, pero depende de la cantidad de conocimiento que haya acumulado a lo largo de su vida. Quienes llegan a la adultez sin información suficiente corren un destino terrible: su propia alma los consume."
alma=""

[Theresa]

nombre="Eirene"
descripcion="	Eirene nació en una isla de Grecia, criada en devoción absoluta. Desde niña le enseñaron que su pureza era su mayor valor, tan sagrada como su fe a Hestia. Nunca conoció a un hombre. Sabía de su existencia y le despertaban curiosidad, pero también rechazo; la idea la atraía y la asqueaba al mismo tiempo. Cuando la noticia de la muerte del Papa llegó a la isla, las hermanas debieron elegir a una para disputar el trono. Theresa fue elegida por mayoría. Desde ese instante, el peso cayó sobre ella. Sintió miedo. Una responsabilidad que no había pedido. No deseaba el poder. Pero sabía que debía ganar. No podía permitir que un hombre se sentara en el trono. El terror no era perder, sino lo que les harían a ella y a sus hermanas si eso ocurría. Ese miedo la acompaña en silencio, empujándola hacia una lucha que no eligió. Y aun así, avanzará."
religion="	Eirene pertenece a una religión griega devota a Hestia y Artemisa. Su fe es absoluta y no admite excepción alguna. Cualquier contacto con un hombre está prohibido. No existe perdón. No existe justificación. Si una hermana es descubierta tocando a un hombre, será ejecutada. No rápido. No con piedad. Será asesinada de la forma más lenta posible, para que el sufrimiento sea advertencia. El dolor es parte del castigo, y el castigo es doctrina. El hombre involucrado no muere de inmediato. Es cazado. Tratado como animal. Las hermanas lo persiguen y lo destrozan con rituales de caza. Aquella que logre matarlo recibe un favor divino de Artemisa, una recompensa sagrada por cumplir la voluntad de la diosa. Para ellas, no es crueldad. Es fe."
alma=""

[Corvus]

nombre="Fray Corvus"
descripcion="	Fray Corvus nació con la capacidad de manipular almas. Ese don lo llevó a convertirse en el exorcista más poderoso de su tiempo. Pero los espíritus expulsados no podían desaparecer: necesitaban un recipiente o regresarían. Para proteger a otros, Corvus los encerró en sí mismo. Uno a uno. Almas sobre almas. Con el tiempo, su cuerpo se volvió prisión y su mente comenzó a quebrarse. Las voces se acumularon, se mezclaron, se superpusieron. Su identidad se diluyó. Ya no era solo Corvus: era la suma de todo lo que cargaba. Un solo cuerpo habitado por muchos. Cuando la Monja Roja vio su locura, se interesó. No lo temió. Lo buscó. Volvía una y otra vez para hablar con él. Entre diálogos imposibles y risas rotas, nació algo extraño: comprensión mutua. Un vínculo sin nombre. Un día, ella le dijo que mataría al Papa. Corvus no se opuso. No se sorprendió. Cuando el trono quedó vacío, entró en la lucha por diversión. No por fe. No por poder. Porque el caos le resultaba familiar."
religion="	Fray Corvus pertenece al cristianismo africano, una tradición en la que se destacan como expertos en exorcismos. A través de rituales complejos, buscan obtener bendiciones de los Eternos, y cada tatuaje en su cuerpo es una manifestación tangible de su poder y de las fuerzas que han invocado. Su dominio no proviene solo de la fe, sino de la habilidad para canalizar lo sobrenatural en cada gesto y marca sobre su piel."
alma=""

[Galaad]

nombre="Galaad"
descripcion="	Desde niño anheló el poder, pero nunca creyó en nada. La fe le parecía inútil; la política, en cambio, era una herramienta perfecta. Creció como un manipulador frío, eliminando a cualquiera que hablara en su contra o amenazara su posición. No discutía: borraba. Cuando se anunció la muerte del Papa, entendió que era su momento. El trono no necesitaba devoción, solo control. Nadie se opondría a un dios hecho de autoridad y miedo. Entró en la disputa sin dudar. Sabía que en la fe no tenía seguidores. Así que creó los suyos. Convocó a una rueda de prensa, reunió a todos los que lo seguían y los maldijo. Uno por uno, los convirtió en monaquillos. Con ellos formó su ejército. Sin voluntad. Sin voz. Solo obediencia. Con una multitud de cuerpos sometidos, Galaad avanzó hacia el trono. No como creyente. Sino como amo."
religion="	Galaad pertenece al sincretismo del protestantismo estadounidense. las personas nacen con un destino de liderazgo; su poder no reside en ellos mismos, sino en la cantidad de seguidores que logran atraer. Sin creyentes a su alrededor, carecen de fuerza. Muchos de ellos terminan convirtiéndose en políticos o líderes de cultos, canalizando su influencia sobre quienes dependen de su guía."
alma=""

[Kapparah]

nombre="Kapparah"
descripcion="	Kapparah fue maldito siendo niño. La religión lo tomó y lo convirtió en monaquillo, arrancándole el nombre, el futuro y la elección. Durante años soportó abusos, humillaciones y rituales que buscaban vaciarlo por completo. Su cuerpo fue tratado como objeto, su dolor como doctrina. Pero su fe no se quebró. Al contrario: se volvió más intensa. Donde otros se vaciaban, Kappara resistía. Creía sin entender, obedecía sin rendirse, y en esa obstinación silenciosa su voluntad comenzó a fortalecerse. Conoció a Caelius y sufrió bajo sus manos sin misericordia. Más tarde cayó en manos de Espina, y allí el dolor alcanzó un límite inhumano. Estuvo a punto de romperse. Estuvo a punto de desaparecer. Sin embargo, algo en él se negó a ceder. No fue rabia ni odio: fue fe pura, sostenida por una voluntad inquebrantable. Ese acto interior lo hizo ascender. Kappara rompió la maldición sin necesitar el poder papal. La cadena se abrió desde adentro. Libre por primera vez, intentó salvar a otros monaquillos, pero ninguno logró seguirlo. La mayoría estaba demasiado rota. Aun así, no se rindió. Cuando escuchó de la muerte del Papa, sintió pena por el mundo que quedaba sin guía. Pero también comprendió la oportunidad. Si alcanzaba el trono, el poder podría ser usado para destruir Devotio Aeterna, liberar a los monaquillos y detener los abusos para siempre. Kappara no busca venganza. Busca que nadie vuelva a ser tratado como cosa. Y esta vez, no piensa fallar."
religion="	Kapparah pertenecía al Devotio Aeterna, pero ascendió y se convirtió en judío. En esta religión, sus miembros son personas puras, sin maldad, con un enorme poder espiritual. El Kappara es el único judío, pues solo mediante la ascensión se puede pertenecer a esta tradición, y él fue el único capaz de lograrlo, convirtiéndose en un ser de poder excepcional y singular."
alma=""

[Devotio]

nombre="Devotio Aeterna"
descripcion="	Es la maldición más poderosa conocida. No castiga: borra. Al ser invocada sobre una persona , su cuerpo y su alma son deformados para siempre. Su voz deja de ser humana y se transforma en el sonido de campanas vivas, un recordatorio constante de su sometimiento. Cada palabra que pronuncia ya no expresa voluntad, solo obediencia. Desde ese instante:
	- pierde todo derecho,
	- deja de ser persona,
	- se convierte en propiedad religiosa.
	La maldición fue creada originalmente para reprimir a los no creyentes, para quebrarlos desde la infancia y convertirlos en símbolos vivientes de fe forzada. Con el tiempo, su uso se corrompió: pasó a emplearse para castigar, controlar, silenciar y abastecer de poder a las altas jerarquías. Devotio Aeterna no puede ser invocada por cualquiera. Solo alguien con poder real, influencia y seguidores puede activarla. La maldición necesita fe ajena para existir: cuanta más gente siga al invocador, más absoluta es su efecto. Existen solo dos caminos:
	1. El poder papal: El trono puede anular la maldición, pero casi nunca lo hace. Liberar a un monaquillo debilita el sistema.
	2. Voluntad y fe absolutas: Un caso casi imposible. El afectado debe sostener su fe sin quebrarse, incluso bajo abuso, humillación y dolor ritual. Cuando la voluntad supera a la maldición, esta se rompe desde dentro.
	Incluso rota, la marca queda. El cuerpo recuerda. La voz nunca vuelve a sonar igual"

[Reves]

nombre="Sintaxis al Revés"
descripcion="	Es una maldición simple y común. Cualquiera puede invocarla, no requiere ritual complejo ni jerarquía religiosa. Efecto: La maldición invierte el orden del habla: la última palabra de una frase se pronuncia primero, luego siguen las anteriores, hasta terminar con la inicial. No altera la mente, el cuerpo ni la fe. Solo afecta la forma en que el lenguaje se manifiesta. Ruptura: Se puede romper con un poco de fe o concentración. No exige poder papal ni voluntad extrema"

[Trono]

nombre="Trono papal"
descripcion="	Quien se sienta y reclama el Trono Papal asciende a un estado casi divino. Toda maldición que lance solo puede ser anulada por él mismo. El poder del trono es absoluto: nadie puede oponerse a su autoridad ni contrarrestar su poder, excepto la Monja Roja, creadora del trono. Al reclamarlo, el portador se fusiona con su propia alma. Desde ese momento:
	- es inmune a cualquier maldición,
	- no puede morir por vejez,
	- no enferma ni se debilita con el tiempo.
	El único modo de acabar con quien posee el Trono Papal es un ataque físico verdaderamente mortal. El trono no elige. El mundo obedece."

[Alma]

nombre="Las Almas"
descripcion="	Toda persona puede invocar su propia alma. El alma revela el verdadero ser de quien la invoca: lo que se oculta en vida se manifiesta como una deformación, reflejando pecados, deseos reprimidos y verdades negadas. Nadie puede manipular un alma ajena. La única excepción es la maldición Devotio Aeterna, que anula el individualismo y somete el alma. Las almas de los muertos no abandonan sus cuerpos. Incluso tras la muerte permanecen ancladas, por lo que pueden ser extraídas para otorgar poder a otros. Un alma dañada o fragmentada es inestable al ser invocada, pudiendo volverse impredecible o destructiva. Las almas siempre existieron dentro de las personas, pero no podían ser invocadas... hasta que la Monja Roja permitió que todos accedieran a ellas."

[MonjaPoder]

nombre="La Monja Roja"
descripcion="La Monja no es solo una entidad poderosa: es una fuerza del mundo. Existía desde antes de todo, observándolo todo. Y el mundo, para ella, era terriblemente aburrido. Usó su influencia para corromperlo, deformarlo, volverlo caótico, hacerlo más divertido. Primero permitió que los humanos invocaran sus almas. Eso desató conflictos, revelaciones, guerras internas... pero duró poco. Se volvió predecible. Entonces creó el Trono Papal, para que los humanos se mataran entre ellos por el poder absoluto. Funcionó un tiempo. Luego, otra vez, monotonía. Después nacieron las maldiciones. Dolor, control, desesperación. Y aun así... el aburrimiento regresó. Fue entonces cuando la Monja encontró su verdadera diversión: intervenir directamente. No solo mover piezas, sino narrar. Convertir cada pelea, cada traición y cada muerte en un drama. Exagerar, provocar, empujar al desastre, comentar la caída de los poderosos como si fuera una obra. La Monja no busca gobernar. Busca entretenerse. Y el mundo entero es su escenario"
